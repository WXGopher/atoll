[workspace]
resolver = "2"
members = [
    "crates/atoll-hook",
    "crates/atoll-core",
    "crates/atoll",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/WXGopher/atoll"

[workspace.dependencies]
atoll-core = { path = "crates/atoll-core", version = "0.1.4" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.17.1"
slint-build = "1.17.1"
tempfile = "3"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tray-icon = "0.24"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
# `z` everywhere costs the UI its frame rate: the renderer's inner loops are
# hot enough that optimizing them for size is visible as stutter while dragging.
# The hook binary, which is the one that has to start in single-digit
# milliseconds, keeps `z` through the override below.
opt-level = 2
codegen-units = 1
panic = "abort"

[profile.release.package.atoll-hook]
opt-level = "z"
