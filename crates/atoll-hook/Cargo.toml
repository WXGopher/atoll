[package]
name = "atoll-hook"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal hook binary invoked by Claude Code and Codex to report session events to Atoll."

[[bin]]
name = "atoll-hook"
path = "src/main.rs"

[dependencies]
# No tokio, no clap: this binary is spawned on every hook event, so it depends
# only on serde_json and the dependency-free half of `atoll-core`.
atoll-core = { path = "../atoll-core", version = "0.1.1", default-features = false }
serde_json.workspace = true
