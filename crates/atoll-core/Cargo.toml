[package]
name = "atoll-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types and logic for Atoll: agent session monitoring, approvals, and usage tracking."

[features]
default = ["server"]
# The named-pipe server pulls in tokio. `atoll-hook` turns it off so the hook
# binary stays tiny and starts in single-digit milliseconds.
server = ["dep:tokio", "dep:toml_edit", "dep:base64", "dep:rusqlite"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
toml_edit = { version = "0.25.13", optional = true }
base64 = { version = "0.22", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile.workspace = true
