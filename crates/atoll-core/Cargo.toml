[package]
name = "atoll-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types and logic for Atoll: agent session monitoring, approvals, and usage tracking."

[features]
default = ["server"]
# The named-pipe server pulls in tokio. `atoll-hook` turns it off so the hook
# binary stays tiny and starts in single-digit milliseconds.
server = ["dep:tokio"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
